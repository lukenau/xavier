<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.3" fill="#18302f"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9FB3B0"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#9FB3B0"/>
    </marker>
  </defs>

  <rect width="1000" height="1190" fill="#0b1517"/>
  <rect width="1000" height="1190" fill="url(#dots)"/>

  <text x="80" y="76" font-family="HubMono-550" font-size="21" letter-spacing="5" fill="#9FB3B0">WHAT RUNS WHERE</text>

  <!-- Your iPhone -->
  <rect x="120" y="116" width="760" height="148" rx="18" fill="#1b150b" stroke="#E0A458" stroke-width="2"/>
  <text x="160" y="182" font-family="HubOnest-560" font-size="40" fill="#EDE6D6">Your iPhone</text>
  <text x="160" y="226" font-family="HubMono-400" font-size="23" fill="#c9b18a">the Xavier app</text>

  <line x1="500" y1="264" x2="500" y2="352" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="316" font-family="HubMono-400" font-size="22" fill="#9FB3B0">HTTPS over your private network</text>

  <!-- Your machine boundary -->
  <rect x="80" y="364" width="840" height="530" rx="26" fill="none" stroke="#2c5154" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="112" y="404" font-family="HubMono-550" font-size="19" letter-spacing="5" fill="#6f9c98">YOUR MACHINE</text>

  <!-- The hub -->
  <rect x="120" y="428" width="760" height="166" rx="18" fill="#0c2620" stroke="#3fbf8a" stroke-width="2"/>
  <text x="160" y="494" font-family="HubOnest-560" font-size="40" fill="#EDE6D6">The hub</text>
  <text x="160" y="538" font-family="HubMono-400" font-size="23" fill="#8fc9ad">API, chat threads, Face ID gate</text>
  <text x="160" y="570" font-family="HubMono-400" font-size="23" fill="#8fc9ad">and your data, on loopback</text>

  <line x1="500" y1="606" x2="500" y2="676" stroke="#9FB3B0" stroke-width="2" marker-start="url(#arrow-back)" marker-end="url(#arrow)"/>
  <text x="528" y="642" font-family="HubMono-400" font-size="22" fill="#9FB3B0">hub-platform plugin</text>

  <!-- Hermes -->
  <rect x="120" y="688" width="760" height="166" rx="18" fill="#16132a" stroke="#8b7be8" stroke-width="2"/>
  <text x="160" y="754" font-family="HubOnest-560" font-size="40" fill="#EDE6D6">Hermes, the agent</text>
  <text x="160" y="798" font-family="HubMono-400" font-size="23" fill="#b3a9ee">tools, memory and scheduled jobs,</text>
  <text x="160" y="830" font-family="HubMono-400" font-size="23" fill="#b3a9ee">from Nous Research</text>

  <line x1="500" y1="854" x2="500" y2="962" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="934" font-family="HubMono-400" font-size="22" fill="#9FB3B0">prompts and their context</text>

  <!-- Model provider -->
  <rect x="120" y="974" width="760" height="148" rx="18" fill="#24140c" stroke="#e8875a" stroke-width="2"/>
  <text x="160" y="1040" font-family="HubOnest-560" font-size="40" fill="#EDE6D6">Your model provider</text>
  <text x="160" y="1084" font-family="HubMono-400" font-size="23" fill="#e3ad8f">chosen in Hermes, e.g. via OpenRouter</text>

  <text x="500" y="1166" text-anchor="middle" font-family="HubOnest-400" font-size="23" fill="#9FB3B0">By default, nothing on your machine is exposed to the internet.</text>
</svg>
