<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.3" fill="#18302f"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9FB3B0"/>
    </marker>
  </defs>

  <rect width="1000" height="1230" fill="#0b1517"/>
  <rect width="1000" height="1230" fill="url(#dots)"/>

  <text x="80" y="76" font-family="HubMono-550" font-size="21" letter-spacing="5" fill="#9FB3B0">WHAT HAPPENS WHEN YOU ASK</text>

  <!-- 1 -->
  <rect x="120" y="116" width="760" height="150" rx="18" fill="#1b150b" stroke="#E0A458" stroke-width="2"/>
  <circle cx="178" cy="191" r="26" fill="none" stroke="#E0A458" stroke-width="2"/>
  <text x="178" y="200" text-anchor="middle" font-family="HubMono-550" font-size="24" fill="#E0A458">1</text>
  <text x="232" y="182" font-family="HubOnest-560" font-size="36" fill="#EDE6D6">You ask</text>
  <text x="232" y="224" font-family="HubMono-400" font-size="22" fill="#c9b18a">in the Xavier app on your iPhone</text>
  <line x1="500" y1="266" x2="500" y2="320" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="120" y="332" width="760" height="150" rx="18" fill="#0c2620" stroke="#3fbf8a" stroke-width="2"/>
  <circle cx="178" cy="407" r="26" fill="none" stroke="#3fbf8a" stroke-width="2"/>
  <text x="178" y="416" text-anchor="middle" font-family="HubMono-550" font-size="24" fill="#3fbf8a">2</text>
  <text x="232" y="398" font-family="HubOnest-560" font-size="36" fill="#EDE6D6">The hub checks it's you</text>
  <text x="232" y="440" font-family="HubMono-400" font-size="22" fill="#8fc9ad">your Face ID chat session; the thread is saved</text>
  <line x1="500" y1="482" x2="500" y2="536" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="120" y="548" width="760" height="150" rx="18" fill="#16132a" stroke="#8b7be8" stroke-width="2"/>
  <circle cx="178" cy="623" r="26" fill="none" stroke="#8b7be8" stroke-width="2"/>
  <text x="178" y="632" text-anchor="middle" font-family="HubMono-550" font-size="24" fill="#8b7be8">3</text>
  <text x="232" y="614" font-family="HubOnest-560" font-size="36" fill="#EDE6D6">Hermes works it out</text>
  <text x="232" y="656" font-family="HubMono-400" font-size="22" fill="#b3a9ee">handed over by the hub-platform plugin</text>
  <line x1="500" y1="698" x2="500" y2="752" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="120" y="764" width="760" height="182" rx="18" fill="#24140c" stroke="#e8875a" stroke-width="2"/>
  <circle cx="178" cy="839" r="26" fill="none" stroke="#e8875a" stroke-width="2"/>
  <text x="178" y="848" text-anchor="middle" font-family="HubMono-550" font-size="24" fill="#e8875a">4</text>
  <text x="232" y="830" font-family="HubOnest-560" font-size="36" fill="#EDE6D6">A model, a tool, or both</text>
  <text x="232" y="872" font-family="HubMono-400" font-size="22" fill="#e3ad8f">the model sees the prompt and its context;</text>
  <text x="232" y="904" font-family="HubMono-400" font-size="22" fill="#e3ad8f">tools run where you set them up</text>
  <line x1="500" y1="946" x2="500" y2="1000" stroke="#9FB3B0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="120" y="1012" width="760" height="150" rx="18" fill="#1b150b" stroke="#E0A458" stroke-width="2"/>
  <circle cx="178" cy="1087" r="26" fill="none" stroke="#E0A458" stroke-width="2"/>
  <text x="178" y="1096" text-anchor="middle" font-family="HubMono-550" font-size="24" fill="#E0A458">5</text>
  <text x="232" y="1078" font-family="HubOnest-560" font-size="36" fill="#EDE6D6">The reply streams back</text>
  <text x="232" y="1120" font-family="HubMono-400" font-size="22" fill="#c9b18a">into the thread, as text and widgets</text>

  <text x="500" y="1208" text-anchor="middle" font-family="HubOnest-400" font-size="23" fill="#9FB3B0">Approvals and most changes also pass Face ID before they run.</text>
</svg>
