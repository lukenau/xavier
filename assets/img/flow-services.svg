<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.3" fill="#18302f"/>
    </pattern>
  </defs>

  <rect width="1000" height="1500" fill="#0b1517"/>
  <rect width="1000" height="1500" fill="url(#dots)"/>

  <text x="80" y="76" font-family="HubMono-550" font-size="21" letter-spacing="5" fill="#9FB3B0">WHAT IT CONNECTS TO</text>

  <!-- The hub -->
  <rect x="120" y="108" width="760" height="140" rx="18" fill="#0c2620" stroke="#3fbf8a" stroke-width="2"/>
  <text x="160" y="170" font-family="HubOnest-560" font-size="40" fill="#EDE6D6">The hub</text>
  <text x="160" y="212" font-family="HubMono-400" font-size="22" fill="#8fc9ad">runs on its own; everything below is optional</text>

  <!-- In this repo -->
  <text x="120" y="310" font-family="HubMono-550" font-size="19" letter-spacing="4" fill="#b3a9ee">IN THIS REPO, OPT-IN</text>
  <rect x="120" y="328" width="760" height="96" rx="14" fill="#141225" stroke="#8b7be8" stroke-width="2"/>
  <text x="152" y="368" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Hermes plugin</text>
  <text x="152" y="404" font-family="HubMono-400" font-size="21" fill="#b3a9ee">chat, automations and transcripts</text>
  <rect x="120" y="436" width="760" height="96" rx="14" fill="#141225" stroke="#8b7be8" stroke-width="2"/>
  <text x="152" y="476" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">hub-bridge</text>
  <text x="152" y="512" font-family="HubMono-400" font-size="21" fill="#b3a9ee">Hermes config, cron, skills and doctor panels</text>
  <rect x="120" y="544" width="760" height="96" rx="14" fill="#141225" stroke="#8b7be8" stroke-width="2"/>
  <text x="152" y="584" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Terminal kit</text>
  <text x="152" y="620" font-family="HubMono-400" font-size="21" fill="#b3a9ee">a shell and Claude Code sessions, behind Face ID</text>

  <!-- On your side -->
  <text x="120" y="702" font-family="HubMono-550" font-size="19" letter-spacing="4" fill="#7fc6cf">ON YOUR SIDE</text>
  <rect x="120" y="720" width="760" height="96" rx="14" fill="#0e1f22" stroke="#4fb3bf" stroke-width="2"/>
  <text x="152" y="760" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Calendar</text>
  <text x="152" y="796" font-family="HubMono-400" font-size="21" fill="#7fc6cf">a snapshot file your own sync job writes</text>
  <rect x="120" y="828" width="760" height="96" rx="14" fill="#0e1f22" stroke="#4fb3bf" stroke-width="2"/>
  <text x="152" y="868" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Files</text>
  <text x="152" y="904" font-family="HubMono-400" font-size="21" fill="#7fc6cf">read-only folders you choose</text>
  <rect x="120" y="936" width="760" height="96" rx="14" fill="#0e1f22" stroke="#4fb3bf" stroke-width="2"/>
  <text x="152" y="976" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">iMessage drafts</text>
  <text x="152" y="1012" font-family="HubMono-400" font-size="21" fill="#7fc6cf">an MCP server on your Mac</text>

  <!-- Cloud -->
  <text x="120" y="1094" font-family="HubMono-550" font-size="19" letter-spacing="4" fill="#e3ad8f">CLOUD, IF YOU SWITCH IT ON</text>
  <rect x="120" y="1112" width="760" height="96" rx="14" fill="#1f130c" stroke="#e8875a" stroke-width="2"/>
  <text x="152" y="1152" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Your model provider</text>
  <text x="152" y="1188" font-family="HubMono-400" font-size="21" fill="#e3ad8f">chosen in Hermes; sees prompts and context</text>
  <rect x="120" y="1220" width="760" height="96" rx="14" fill="#1f130c" stroke="#e8875a" stroke-width="2"/>
  <text x="152" y="1260" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Push notifications</text>
  <text x="152" y="1296" font-family="HubMono-400" font-size="21" fill="#e3ad8f">reply previews via Expo and Apple</text>
  <rect x="120" y="1328" width="760" height="96" rx="14" fill="#1f130c" stroke="#e8875a" stroke-width="2"/>
  <text x="152" y="1368" font-family="HubOnest-560" font-size="30" fill="#EDE6D6">Discord</text>
  <text x="152" y="1404" font-family="HubMono-400" font-size="21" fill="#e3ad8f">iMessage draft approvals and notices</text>

  <text x="500" y="1474" text-anchor="middle" font-family="HubOnest-400" font-size="23" fill="#9FB3B0">Leave everything off and the hub still starts.</text>
</svg>
